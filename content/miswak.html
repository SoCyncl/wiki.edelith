<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikitable Page</title>
<script src="/scripts/navbar.js" type="text/javascript" defer></script>
<link href="/style/article.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
<!--wrapper-->
<div class="wrapper">
<!--header-->
<header></header>
<!--main-->
<main id="clear">
<p class="breadcrumb">...In <a href="">Templates</a>, <a href="">Code</a></p>
<h1 id="flair"><!--TITLE--></h1>

<!--
  The article grid: the TOC (if the page has enough headings to earn one)
  sits in the left column as a sticky sidebar that scrolls with you, the
  way modern Wikipedia's sidebar does. Below the mobile breakpoint the
  stylesheet turns it into an off-canvas drawer instead, opened by the
  toggle button that the TOC marker below also emits.
-->
<div class="article-grid">

<!--TOC-->

<div class="article-body">

<!--infobox-->
<table class="infotable">
<tbody>
<tr>
<th colspan="2" id="centertext"><!--TITLE--></th>
</tr>
<tr>
<th colspan="2" style="text-align: center;">
<p><img src="{{IMAGE}}" alt="{{TITLE}} render"></p>
</th>
</tr>
<tr>
<td colspan="2" style="text-align: center"><i>{{IMAGECAPTION}}</i></td>
</tr>
<!--INFOBOX-->
</tbody>
</table>
<!--end infobox-->

<!--rendered markdown body goes here, including any [[File:...]] wraparound
     images, hatnotes, pull-quotes and source blocks it contains-->
<!--CONTENT-->

<!--category footer, MediaWiki style-->
<!--CATEGORIES-->

</div>
<!--end article-body-->

</div>
<!--end article-grid-->

</main>
<footer>
<!--LASTEDITED-->
footer
</footer>
</div>
</body>
</html>
